plugins { id 'com.android.application' }

android {
    namespace 'com.example.apklab'
    compileSdk 34
    defaultConfig {
        applicationId 'com.example.apklab'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release {
            minifyEnabled false
            // Demo ke liye debug key se sign: Actions me seedha install hone wali APK milti hai
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.android.tools.build:apksig:8.7.3'
}
